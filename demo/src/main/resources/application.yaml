spring:
  application:
    name: demo

server:
  # Hosting platforms such as Render choose the port and pass it in PORT; otherwise 8080
  port: ${PORT:8080}

app:
  # The build that is running, shown by GET /api/health. CI bakes it into the Docker
  # image as APP_VERSION (e.g. sha-24405c0); local runs show "dev".
  version: dev
