# CD pipeline: promotes each image that CI publishes from master through two environments.
#
#   CI passes on master
#     --> staging     this PC, through the self-hosted runner in D:\actions-runner:
#                     pull the image, replace the container, health check, roll back if unhealthy
#     --> production  Back4app Containers, from a GitHub-hosted runner:
#                     point the "deploy" branch at the new image, then wait until the public
#                     URL serves the new version
#
# Production is continuous delivery, not deployment: Back4app's free plan has no automatic
# deploys, so a person deploys the new commit of the deploy branch in Back4app, and the
# production job turns green once the app serves it. On the free plan the app's URL stays
# live for 60 minutes after each deploy.
#
# Production only gets a version that already worked in staging. The staging runner must be
# running (D:\actions-runner\run.cmd) for a deployment to start; until then it waits in the
# queue. To deploy an earlier version, use "Run workflow" on the Actions tab and give its
# image tag, e.g. sha-24405c0.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to deploy, e.g. sha-24405c0 or latest
        required: true
        default: latest

# One deployment at a time: a newer one waits instead of cancelling one in progress
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: Choose the image
    # Deploy only commits that passed every CI stage; manual runs always deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - name: Choose the image
        id: image
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # CI tags each image with sha-<first 7 characters of the commit>
          tag="${MANUAL_TAG:-sha-${HEAD_SHA::7}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Not a valid image tag: $tag"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ci-cd-demo:$tag"
          echo "Image to deploy: $image"
          echo "name=$image" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy to staging (this PC)
    needs: image
    runs-on: [self-hosted, staging]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # lets GITHUB_TOKEN pull the image from ghcr.io (GitHub Container Registry)
    environment:
      name: staging
      url: http://localhost:8080/api/health
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        env:
          IMAGE: ${{ needs.image.outputs.name }}
        run: docker pull $env:IMAGE

      - name: Replace the running app and check it
        env:
          IMAGE: ${{ needs.image.outputs.name }}
        run: .\.github\scripts\deploy.ps1 -Image $env:IMAGE

  production:
    name: Release to production (Back4app)
    needs: [image, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # pushes the new version to the deploy branch that Back4app builds from
    environment:
      name: production
      url: https://cicddemo-0v43v32k.back4.app/api/health
    steps:
      - uses: actions/checkout@v7

      - name: Check out the deploy branch
        uses: actions/checkout@v7
        with:
          ref: deploy
          path: deploy

      - name: Release on Back4app and wait until it is deployed
        env:
          IMAGE: ${{ needs.image.outputs.name }}
          APP_URL: https://cicddemo-0v43v32k.back4.app
        run: bash .github/scripts/deploy-back4app.sh
